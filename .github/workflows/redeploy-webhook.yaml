name: Redeploy via Webhook

# Pushes to develop/main (including merged PRs) call the host's adnanh/webhook
# endpoint (deploy/setup/setup-webhook.sh), which pulls and redeploys the app.
#   develop -> QA:   https://qa.buildingcode.aot-technologies.com/hooks/redeploy-app
#   main    -> PROD: https://buildingcode.aot-technologies.com/hooks/redeploy-app
#
# Required repository secrets (must match WEBHOOK_SECRET on each host):
#   QA_WEBHOOK_SECRET, PROD_WEBHOOK_SECRET

permissions:
  contents: read

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: redeploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  redeploy:
    if: github.ref_name == 'develop' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger redeploy webhook
        env:
          BRANCH: ${{ github.ref_name }}
          QA_WEBHOOK_SECRET: ${{ secrets.QA_WEBHOOK_SECRET }}
          PROD_WEBHOOK_SECRET: ${{ secrets.PROD_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          if [ "$BRANCH" = "main" ]; then
            URL="https://buildingcode.aot-technologies.com/hooks/redeploy-app"
            SECRET="$PROD_WEBHOOK_SECRET"
            SECRET_NAME="PROD_WEBHOOK_SECRET"
          else
            URL="https://qa.buildingcode.aot-technologies.com/hooks/redeploy-app"
            SECRET="$QA_WEBHOOK_SECRET"
            SECRET_NAME="QA_WEBHOOK_SECRET"
          fi

          if [ -z "$SECRET" ]; then
            echo "::error::Repository secret $SECRET_NAME is not set."
            exit 1
          fi

          # The hook verifies an HMAC-SHA256 of the exact body bytes, so sign
          # and send the same file.
          printf '{"ref":"refs/heads/%s","after":"%s"}' "$BRANCH" "$GITHUB_SHA" > payload.json
          SIG="$(openssl dgst -sha256 -hmac "$SECRET" -r payload.json | cut -d' ' -f1)"

          echo "POST $URL (ref refs/heads/$BRANCH @ ${GITHUB_SHA::7})"
          RESPONSE="$(curl -sS --fail-with-body --retry 3 --retry-all-errors --max-time 30 \
            -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-GitHub-Delivery: gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -H "X-Hub-Signature-256: sha256=$SIG" \
            --data-binary @payload.json)"
          echo "Response: $RESPONSE"

          # adnanh/webhook answers 200 even when trigger rules don't match.
          if [[ "$RESPONSE" == *"rules were not satisfied"* ]]; then
            echo "::error::Webhook rejected the request (bad signature or branch mismatch)."
            exit 1
          fi
